name: Deploy to Shared Hosting

on:
  push:
    tags:
      - "v*"   # contoh: v1.0.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.FTP_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR }}

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ secrets.NODE_VERSION }}

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Nuxt in production
      - name: Build Nuxt
        run: npm run build
        env:
          NUXT_MAINTENANCE_ENABLED: true
          NUXT_API_URL: ${{ secrets.NUXT_API_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # Prepare deploy dir (gabungkan .output + node_modules + package.json)
      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp -r .output deploy/.output
          # Optimasi: Hapus devDependencies agar node_modules lebih ringan
          npm prune --production
          cp -r node_modules deploy/node_modules
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

      # Deploy via SSH (tar over ssh, aman untuk dotfile/symlink seperti .output & node_modules/.bin)
      - name: Upload build via SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          tar -czf - -C deploy . | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$SSH_REMOTE_DIR/tmp' && tar -xzf - -C '$SSH_REMOTE_DIR'"

      # ===== AUTO RESTART NODE.JS APP =====
      - name: Restart Node.js app (Passenger)
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo \"restart \$(date)\" > '$SSH_REMOTE_DIR/tmp/restart.txt'"
